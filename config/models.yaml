models:
  deepseek/flash:
    provider: deepseek
    provider_model_name: deepseek-v4-flash
    options:
      thinking:
        type: enabled
  deepseek/pro:
    provider: deepseek
    provider_model_name: deepseek-v4-pro
    options:
      thinking:
        type: enabled
  gemini/mini:
    provider: openrouter
    provider_model_name: google/gemini-2.0-flash-001
  local/orange:
    provider: orange
    provider_model_name: dummy
    options:
      chat_template_kwargs:
        enable_thinking: false
  kimi:
    provider: kimi
    provider_model_name: kimi-k2.6
    options:
      stream: true
  embeddings/dummy:
    provider: embedding
    provider_model_name: dummy
    is_hidden: true
  stt/dummy:
    provider: transcriber
    provider_model_name: dummy
    is_hidden: true
