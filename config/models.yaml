models:
  deepseek/flash:
    provider: deepseek
    provider_model_name: deepseek-v4-flash
    options:
      thinking:
        type: enabled
  deepseek/pro:
    provider: deepseek
    provider_model_name: deepseek-v4-pro
    options:
      thinking:
        type: enabled
  gemini/mini:
    provider: openrouter
    provider_model_name: google/gemini-3.5-flash-lite
  local/chat:
    provider: orange
    provider_model_name: dummy
    options:
      chat_template_kwargs:
        reasoning_strength: low
        enable_thinking: false
  local/reasoner:
    provider: orange
    provider_model_name: dummy
    reasoning_effort:
      allowed: [low, medium, high]   # values permitted to reach the upstream
      default: high                  # injected when the client sends none
      param: reasoning_effort        # wire location: reasoning_effort | reasoning.effort
    options:
      chat_template_kwargs:
        reasoning_strength: high
        enable_thinking: true
  kimi:
    provider: kimi
    provider_model_name: kimi-k2.7-code
    options:
      stream: true
  embeddings/dummy:
    provider: embedding
    provider_model_name: dummy
    is_hidden: true
  stt/dummy:
    provider: transcriber
    provider_model_name: dummy
    is_hidden: true
